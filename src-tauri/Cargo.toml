[package]
name = "forma"
version = "0.1.0-beta.1"
description = "A local-first project manager for developers"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"

[lib]
name = "forma_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["desktop"]
ipc-tests = ["desktop", "tauri/test"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:opener"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

tempfile = "3"
rfd = { version = "0.15", optional = true }
opener = { version = "0.8", optional = true }
libc = "0.2"
command-group = "5.0.1"
sha2 = "0.10"
serde_json = "1"
regex = "1"
git2 = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "forma"
path = "src/main.rs"
required-features = ["desktop"]

# Executable identity checks read hundreds of MiB for some native CLIs. Keep
# SHA-256 compression optimized in debug/test builds as well as release.
[profile.dev.package.sha2]
opt-level = 3
