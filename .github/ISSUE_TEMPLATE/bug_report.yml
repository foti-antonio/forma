name: Beta bug report
description: Report a reproducible Forma problem using sanitized sample data.
body:
  - type: input
    id: version
    attributes:
      label: Forma version and package SHA-256
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS version, CPU architecture and installer format
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use sample data. Never include credentials, private databases or raw agent logs.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the exact sanitized error and whether the UI rendered/responded.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and workarounds tried
      description: State first-launch/restart results and any platform limitations. Do not bypass OS security.
