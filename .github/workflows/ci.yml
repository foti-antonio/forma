name: CI
on:
  push:
    branches: [main, 'milestone/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      trusted-signing:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/release-version.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_release*.py'
      - run: python3 -m unittest discover -s scripts -p 'test_onboarding*.py'
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
  desktop:
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
    environment: ${{ inputs.trusted-signing && 'release-signing' || '' }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb dbus-x11 python3-gi gir1.2-atspi-2.0 at-spi2-core xdotool wmctrl openbox
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features ipc-tests
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-features --all-targets -- -D warnings
      - name: Record installed Linux native library versions
        if: runner.os == 'Linux'
        run: pkg-config --modversion gtk+-3.0 webkit2gtk-4.1
      - name: Build unsigned review candidate
        if: ${{ !inputs.trusted-signing }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Import Windows signing certificate
        if: inputs.trusted-signing && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Missing protected Windows signing credentials' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'forma-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $cert = @($cert | Where-Object { $_.HasPrivateKey -and ($_.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.3') })
            if ($cert.Count -ne 1) { throw 'Expected exactly one code-signing private key' }
            $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com'; tsp = $true } } }
            $config | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:RUNNER_TEMP 'forma-signing.json')
          } finally { Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue }
      - name: Build signed Windows installers
        if: inputs.trusted-signing && runner.os == 'Windows'
        shell: pwsh
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$env:RUNNER_TEMP/forma-signing.json"
      - name: Verify Windows trust
        if: inputs.trusted-signing && runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle' -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if ($files.Count -ne 2) { throw 'Expected NSIS and MSI' }
          $files += Get-Item 'src-tauri/target/${{ matrix.target }}/release/forma.exe'
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) { throw 'Binary signature is not trusted or timestamp is missing' }
            $expected = (Get-Content (Join-Path $env:RUNNER_TEMP 'forma-signing.json') | ConvertFrom-Json).bundle.windows.certificateThumbprint
            if ($signature.SignerCertificate.Thumbprint -ne $expected) { throw 'Unexpected signing identity' }
          }
      - name: Build Developer ID signed and notarized macOS bundles
        if: inputs.trusted-signing && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing protected macOS signing credentials"; exit 1; }
          done
          case "$APPLE_SIGNING_IDENTITY" in 'Developer ID Application:'*) ;; *) echo 'Developer ID Application identity required'; exit 1;; esac
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Forma.app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute "$app"
          xcrun stapler validate "$app"
          for image in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            codesign --verify --strict "$image"
            receipt="$RUNNER_TEMP/forma-dmg-notarization.json"
            xcrun notarytool submit "$image" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$receipt"
            python3 -c 'import json, sys; status = json.load(open(sys.argv[1]))["status"]; sys.exit(0 if status == "Accepted" else "Apple rejected DMG notarization")' "$receipt"
            xcrun stapler staple "$image"
            xcrun stapler validate "$image"
          done
      - name: Build Linux release installers
        if: inputs.trusted-signing && runner.os == 'Linux'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Native first-task onboarding (Windows)
        if: runner.os == 'Windows'
        run: python3 scripts/native-onboarding-platform.py src-tauri/target/${{ matrix.target }}/release/forma.exe
      - name: Native first-task onboarding (Intel and Apple Silicon macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          status=0
          python3 scripts/native-onboarding-platform.py src-tauri/target/${{ matrix.target }}/release/forma || status=$?
          if [ "$status" = 77 ]; then
            echo '::warning::Native onboarding unverified: runner Accessibility permission unavailable; no TCC bypass attempted'
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
      - name: Packaged native initialization (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 scripts/package-smoke.py src-tauri/target/${{ matrix.target }}/release/bundle --install-deb --ui
      - name: AppImage FUSE-free initialization and restart
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 scripts/package-smoke.py src-tauri/target/${{ matrix.target }}/release/bundle --format appimage --ui
      - name: Fresh MSI install, native UI persistence, restart and uninstall
        if: runner.os == 'Windows'
        run: python3 scripts/package-smoke.py src-tauri/target/${{ matrix.target }}/release/bundle --format msi --ui
      - name: Fresh NSIS install, native UI persistence, restart and uninstall
        if: runner.os == 'Windows'
        run: python3 scripts/package-smoke.py src-tauri/target/${{ matrix.target }}/release/bundle --format nsis --ui
      - name: Download verified internal Windows 0.1.0 upgrade baseline
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: forma-x86_64-pc-windows-msvc
          path: upgrade-baseline
          run-id: 38793649445
          github-token: ${{ github.token }}
      - name: Record Windows upgrade baseline checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = @{
            'Forma_0.1.0_x64_en-US.msi' = 'ab5e74a3778d8e6339c924f85427cd3599fb0c3276b2a3d2e135d1a598f12c28'
            'Forma_0.1.0_x64-setup.exe' = '8bea842d55f4e80a3e6baadd2909f3d9b3872b17d665d912dcd770143886612d'
          }
          $files = @(Get-ChildItem upgrade-baseline -Recurse -File)
          if ($files.Count -ne 2) { throw 'Expected exactly two verified baseline installers' }
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $expected[$file.Name]) { throw 'Upgrade baseline differs from the verified M06.1 bytes' }
            Write-Output "$hash  $($file.Name)"
          }
      - name: MSI install, upgrade, restart and uninstall
        if: runner.os == 'Windows'
        run: python3 scripts/package-smoke.py src-tauri/target/${{ matrix.target }}/release/bundle --format msi --ui --upgrade-from upgrade-baseline
      - name: NSIS install, upgrade, restart and uninstall
        if: runner.os == 'Windows'
        run: python3 scripts/package-smoke.py src-tauri/target/${{ matrix.target }}/release/bundle --ui --upgrade-from upgrade-baseline
      - name: DMG metadata, native launch, restart and AX availability
        if: runner.os == 'macOS'
        run: python3 scripts/package-smoke.py src-tauri/target/${{ matrix.target }}/release/bundle --ui
      - name: Preserve package diagnostics (sample data only; no database or core uploads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence-${{ matrix.target }}
          path: package-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect architecture-specific installers and SHA-256
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          python3 scripts/release-artifacts.py collect src-tauri/target/${{ matrix.target }}/release/bundle --target ${{ matrix.target }} --output candidate --version "$version" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: forma-${{ matrix.target }}
          path: candidate/
          retention-days: 30
          if-no-files-found: error
  candidate:
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: forma-*
          path: candidate
          merge-multiple: true
      - name: Verify all six installers and create combined checksums
        run: |
          version=$(node -p "require('./package.json').version")
          python3 scripts/release-artifacts.py verify candidate --version "$version" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: forma-beta-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30
